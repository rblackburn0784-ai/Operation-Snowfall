# Copy to config.toml. NEVER paste your bot token here.
[discord]
# Dedicated event Discord server ID (not ordinary MafiaReturns community Discord)
guild_id = 0
# Kat and trusted hosts: Discord *user* IDs, full lifecycle controls
admin_user_ids = []
# Optional trusted staff *role* IDs; may review disputes, not start or finalize
staff_role_ids = []
# Dedicated five-minute, single-message leaderboard channel.
leaderboard_channel_id = 1571697566842748970
# Daily themed event updates and milestone announcements.
announcement_channel_id = 1571828901024374824

[event]
season_key = "christmas-2026"
name = "Operation Snowfall"
# UTC kickoff; registration opens automatically 168 hours before this time
starts_at_utc = "REPLACE_WITH_UTC_TIMESTAMP"
duration_days = 7
registration_open_hours_before = 168
identity_mode = "self_declaration"
prize_mode = "individual_only"
city_championship = "bragging_rights_only"

[storage]
database_path = "data/snowfall.sqlite3"
