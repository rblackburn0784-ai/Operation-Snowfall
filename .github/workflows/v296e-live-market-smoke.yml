name: v2.9.6e deployed Winter Market smoke
on:
  push:
    branches: [qa/v2.9.6e-live-market-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-market-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live catalogue and original artwork bytes
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,hashlib,pathlib
          base="https://snowfall-web-qa-staging.up.railway.app"
          def get(path):
              with urllib.request.urlopen(base+path,timeout=20) as r:
                  return r.read(),r.headers
          for i in range(72):
              try:
                  cfg=json.loads(get("/v1/web/config")[0])
                  assert cfg["version"]=="2.9.6e",cfg["version"]
                  assert cfg["staging"] is True and cfg["branding"]=={"banner":True,"icon":True}
                  get("/v1/ready")
                  boss=json.loads(get("/v1/web/boss")[0])
                  cat=json.loads(get("/v1/game/catalog")[0])["items"]
                  assert len(cat)==18,len(cat)
                  break
              except Exception:
                  if i==71: raise
                  time.sleep(5)
          artwork={"frame":"frames","trail":"trails","gear":"gear","banner":"banners"}
          for item in cat:
              key,category=item["key"],item["category"]
              name=("v290/portraits/"+(key if key.endswith("_f") else key+"_m")+".webp") if category=="portrait" else "v290/cosmetics/"+artwork[category]+"/"+key+".png"
              data,headers=get("/art/"+name)
              assert headers.get("Content-Type","").startswith("image/"),name
              assert hashlib.sha256(data).digest()==hashlib.sha256(pathlib.Path("src/snowfall/graphics/art",name).read_bytes()).digest(),name
              print("PASS original catalogue artwork",key,item["cost"],item["rarity"])
          for name in ("v290/cosmetics/backgrounds/shop.webp","v290/cosmetics/backgrounds/headquarters.webp","items/cocoa.png","items/fort.png","items/mittens.png","items/bomb.png"):
              data,headers=get("/art/"+name)
              assert headers.get("Content-Type","").startswith("image/")
              assert hashlib.sha256(data).digest()==hashlib.sha256(pathlib.Path("src/snowfall/graphics/art",name).read_bytes()).digest()
          print("LIVE:",cfg["version"],"exact artwork for",len(cat),"cosmetics; boss",boss["state"])
          pathlib.Path("catalogue.json").write_text(json.dumps(cat))
          PY
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Render guest and fictional player fitting room without real writes
        shell: bash
        run: |
          mkdir -p qa-screenshots
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          from urllib.parse import urlsplit
          from datetime import datetime,timezone
          import json,pathlib
          base="https://snowfall-web-qa-staging.up.railway.app"
          cat=json.loads(pathlib.Path("catalogue.json").read_text())
          costs={i["key"]:i["cost"] for i in cat}
          fake="999999999999999999"
          for_name="QA Fitting Model - fictional"
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              for label,w,h in [("desktop",1440,1000),("mobile",390,844),("small-mobile",320,740)]:
                  page=browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1)
                  errors=[];page.on("pageerror",lambda e:errors.append(str(e)))
                  equipment={"frame":"ice_frame","portrait":"noir_detective"}
                  owned=list(equipment.values())
                  balance=60
                  intercepted=[]
                  is_guest=[False]
                  now=datetime.now(timezone.utc).isoformat()
                  def route_request(route):
                      global balance
                      req=route.request
                      path=urlsplit(req.url).path
                      def reply(data,status=200): route.fulfill(status=status,content_type="application/json",body=json.dumps(data))
                      if req.method not in ("GET","HEAD"):
                          # Simulate the server only inside the browser; never forward any writes.
                          if path not in ("/v1/game/wardrobe/purchase","/v1/game/wardrobe/equip"):
                              route.abort();return
                          if is_guest[0]: route.abort();return
                          item=req.post_data_json["item"]
                          assert req.headers.get("x-snowfall-csrf")=="fixture-no-real-session"
                          if path.endswith("purchase"):
                              assert req.headers.get("idempotency-key")
                              assert item not in owned and balance>=costs[item]
                              owned.append(item);balance-=costs[item]
                          else:
                              assert item in owned
                              category=next(i["category"] for i in cat if i["key"]==item)
                              equipment[category]=item
                          intercepted.append([path,item])
                          reply({"message":"Fictional fixture action only"});return
                      if path=="/v1/auth/session":
                          if is_guest[0]: reply({"detail":"Authentication required"},401)
                          else: reply({"player_id":fake,"csrf":"fixture-no-real-session","links":[{"provider":"underworld"},{"provider":"discord"}]})
                      elif path=="/v1/game/catalog": reply({"items":cat})
                      elif path=="/v1/game/me": reply({"registered":True,"player_id":fake,"mr_username":for_name,"city":"Chicago","phase":"live","day":2,"score":42,"resources":{"snowballs":10,"warmth":80,"snowflakes":balance}})
                      elif path=="/v1/game/wardrobe": reply({"balance":balance,"unlocked":owned,"equipped":equipment})
                      elif path=="/v1/game/world": reply({"boss_hp":76,"boss_max_hp":150})
                      elif path=="/v1/game/targets": reply({"targets":[]})
                      elif path=="/v1/game/progress": reply({"registered":True,"score":42,"snowballs":10,"snowflakes":balance,"boss_hp":76,"boss_max_hp":150})
                      elif path=="/v1/verification/status": reply({"state":"not_started"})
                      elif path=="/v1/game/headquarters": reply({"registered":True,"phase":"live","day":2,"server_time":now,"daily_points":12,"rank":3,"season_points":42,"caps":{"snowballs":12,"warmth":100,"pvp":300},"today_pvp":12,"timers":{},"title":"Snowball Rookie","rarity":"Common","quests":[],"trophies":[],"records":{},"next_action":"Find a rival","next_action_route":"fight","daily_gift":"Opened","bonus_gift":"Not today"})
                      else: route.continue_()
                  page.route("**/*",route_request)
                  def open_market():
                      page.goto(base,wait_until="domcontentloaded",timeout=45000)
                      expect(page.locator("#marketCount")).to_have_text("18 of 18 items",timeout=30000)
                      if w<=780: page.locator("#menuToggle").click()
                      page.locator('.topnav [data-nav="shop"]').click()
                      expect(page.locator("#marketFitting")).to_be_visible()
                  def loaded(id):
                      expect(page.locator("#"+id)).to_be_visible(timeout=20000)
                      page.wait_for_function("(id)=>{const i=document.getElementById(id);return i.complete&&i.naturalWidth>0}",arg=id,timeout=20000)
                  open_market()
                  expect(page.locator("#fitPlayerName")).to_have_text(for_name)
                  expect(page.locator("#fitFrame")).to_have_attribute("data-cosmetic","ice_frame")
                  expect(page.locator("#shopBalance")).to_have_text("60")
                  loaded("featuredArt")
                  page.locator("#featuredNext").click()
                  page.locator("#marketCategory").select_option("frame")
                  expect(page.locator("#marketCount")).to_have_text("3 of 18 items")
                  page.locator('[data-try="gold_frame"]').click()
                  expect(page.locator("#fitFrame")).to_have_attribute("data-cosmetic","gold_frame")
                  expect(page.locator("#hqFrame")).to_have_attribute("data-cosmetic","ice_frame")
                  page.locator("#marketClear").click()
                  page.locator("#marketRarity").select_option("Legendary")
                  page.locator("#marketSearch").fill("female")
                  expect(page.locator("#marketCount")).to_have_text("1 of 18 items")
                  page.locator('[data-try="frost_spectre_f"]').click()
                  expect(page.locator("#fitPortrait")).to_have_attribute("data-cosmetic","frost_spectre_f")
                  loaded("fitPortrait");loaded("fitFrame")
                  expect(page.locator("#fitCost")).to_contain_text("33 Snowflakes")
                  expect(page.locator("#shopBalance")).to_have_text("60")
                  assert intercepted==[],intercepted
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  page.screenshot(path=f"qa-screenshots/{label}-fitting.png",full_page=True)
                  # Explicitly buy; then separately equip. Intercept both requests.
                  page.once("dialog",lambda dialog:dialog.dismiss())
                  page.locator('[data-fit-action="buy"][data-item="gold_frame"]').click()
                  assert intercepted==[],intercepted
                  page.once("dialog",lambda dialog:dialog.accept())
                  page.locator('[data-fit-action="buy"][data-item="gold_frame"]').click()
                  expect(page.locator("#shopBalance")).to_have_text("45",timeout=30000)
                  expect(page.locator("#hqFrame")).to_have_attribute("data-cosmetic","ice_frame")
                  page.locator('[data-fit-action="equip"][data-item="gold_frame"]').click()
                  expect(page.locator("#hqFrame")).to_have_attribute("data-cosmetic","gold_frame",timeout=30000)
                  assert intercepted==[["/v1/game/wardrobe/purchase","gold_frame"],["/v1/game/wardrobe/equip","gold_frame"]],intercepted
                  page.locator("#fitReset").click()
                  expect(page.locator("#fitFrame")).to_have_attribute("data-cosmetic","gold_frame")
                  expect(page.locator("#fitPortrait")).to_have_attribute("data-cosmetic","noir_detective")
                  page.locator("#marketClear").click()
                  page.locator("#marketOwnership").select_option("equipped")
                  expect(page.locator("#marketCount")).to_have_text("2 of 18 items")
                  page.locator("#craftChoice").select_option("bomb")
                  expect(page.locator("#craftArtwork")).to_have_attribute("src","/art/items/bomb.png")
                  loaded("craftArtwork")
                  assert not errors,errors
                  page.screenshot(path=f"qa-screenshots/{label}-owned.png",full_page=True)
                  # New guest context cannot access private wardrobe, but can preview.
                  is_guest[0]=True
                  open_market()
                  expect(page.locator("#fitPlayerName")).to_have_text("Guest fitting model")
                  expect(page.locator("#shopBalance")).to_have_text("—")
                  page.locator('[data-try="holly_frame"]').click()
                  expect(page.locator("#fitFrame")).to_have_attribute("data-cosmetic","holly_frame")
                  expect(page.locator('[data-fit-action="buy"][data-item="holly_frame"]')).to_be_disabled()
                  assert len(intercepted)==2
                  assert not errors,errors
                  print(label,"PASS artwork, filters, preview isolation, cancelled purchase, fictional purchase/equip, guest limits")
                  page.close()
              browser.close()
          print("All writes intercepted locally; no actual game data changed.")
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowfall-v296e-market-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
