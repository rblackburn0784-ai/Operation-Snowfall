name: v2.9.6h deployed quick-play smoke
on:
  push:
    branches: [qa/v2.9.6h-live-usability-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-usability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live build, rules and untouched artwork
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,hashlib,pathlib
          base="https://snowfall-web-qa-staging.up.railway.app"
          def get(path):
              with urllib.request.urlopen(base+path,timeout=20) as r:
                  return r.read()
          for i in range(84):
              try:
                  cfg=json.loads(get("/v1/web/config"))
                  assert cfg["version"]=="2.9.6h",cfg["version"]
                  assert cfg["staging"] and cfg["branding"]=={"banner":True,"icon":True}
                  assert cfg["play_rules"]["boss_limit"]==6
                  assert cfg["play_rules"]["pvp_cap"]==300
                  get("/v1/ready");get("/v1/web/boss");get("/v1/web/territory");get("/v1/web/wire");get("/v1/game/catalog")
                  break
              except Exception:
                  if i==83: raise
                  time.sleep(5)
          for path in ("boss/snow_don_100.png","v290/boss/final_defeat.webp","v290/cosmetics/backgrounds/headquarters.webp","v290/cosmetics/frames/gold_frame.png","v290/cities/map/six_city_territory_map.png","v290/wire/banners/snowfall_wire_masthead.png"):
              assert hashlib.sha256(get("/art/"+path)).digest()==hashlib.sha256(pathlib.Path("src/snowfall/graphics/art",path).read_bytes()).digest()
          print("Live QA release verified; game rules and original artwork present.")
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify jump-in flow, mobile navigation and safe action retry
        shell: bash
        run: |
          mkdir -p qa-screenshots
          python - <<'PY'
          from playwright.sync_api import sync_playwright,expect
          from urllib.parse import urlsplit
          from datetime import datetime,timezone,timedelta
          import json
          base="https://snowfall-web-qa-staging.up.railway.app"
          fake="999999999999999999"
          rival={"player_id":"999999999999999998","mr_username":"QA Rival","city":"Detroit","warmth":80,"hits_remaining":2}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              for label,w,h in [("desktop",1440,1000),("mobile",390,844),("small-mobile",320,740)]:
                  state={"account":"guest","ammo":10,"score":42,"rivals":[rival],"cooldown":None,"keys":[],"committed":False}
                  page=browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1,reduced_motion="reduce")
                  errors=[];page.on("pageerror",lambda e:errors.append(str(e)))
                  def route_request(route):
                      req=route.request;path=urlsplit(req.url).path
                      def reply(data,status=200):route.fulfill(status=status,content_type="application/json",body=json.dumps(data))
                      if req.method not in ("GET","HEAD"):
                          if path!="/v1/game/throw":route.abort();return
                          assert state["account"]=="linked"
                          assert req.headers.get("x-snowfall-csrf")=="fixture-csrf"
                          body=req.post_data_json
                          assert body=={"target_player_id":rival["player_id"],"style":"standard"},body
                          key=req.headers.get("idempotency-key");assert key
                          state["keys"].append(key)
                          if not state["committed"]:
                              state.update(committed=True,ammo=9,score=54,rivals=[],cooldown=(datetime.now(timezone.utc)+timedelta(seconds=60)).isoformat())
                              route.abort();return
                          assert key==state["keys"][0],"retry changed idempotency key"
                          reply({"hit":True,"points_awarded":12,"warmth_damage":14,"armour_damage":0,"repeated":True})
                          return
                      if path=="/v1/auth/session":
                          if state["account"]=="guest":reply({"detail":"Not authenticated"},401)
                          else:reply({"player_id":fake,"csrf":"fixture-csrf","links":[{"provider":"underworld" if state["account"]=="linked" else "discord"}]})
                      elif path=="/v1/game/me":reply({"registered":state["account"]=="linked","player_id":fake,"mr_username":"QA Quick Player","city":"Chicago","phase":"live","day":2,"score":state["score"],"resources":{"snowballs":state["ammo"],"warmth":80,"snowflakes":53,"today_pvp":0}})
                      elif path=="/v1/game/targets":reply({"targets":state["rivals"]})
                      elif path=="/v1/game/wardrobe":reply({"balance":53,"unlocked":["gold_frame"],"equipped":{"frame":"gold_frame"}})
                      elif path=="/v1/game/world":reply({"boss_hp":76,"boss_max_hp":150,"boss_attempts":1,"boss_points":5,"siege_attempts":0,"siege_points":0,"boss_enabled":True})
                      elif path=="/v1/game/progress":reply({"registered":True,"score":state["score"],"snowballs":state["ammo"],"snowflakes":53,"boss_hp":76,"boss_max_hp":150,"inventory":{"golden":0,"fort":0}})
                      elif path=="/v1/game/headquarters":reply({"registered":True,"phase":"live","day":2,"server_time":datetime.now(timezone.utc).isoformat(),"daily_points":12,"rank":3,"season_points":state["score"],"caps":{"snowballs":12,"warmth":100,"pvp":300},"today_pvp":0,"timers":{"throw":state["cooldown"]},"title":"Snowball Recruit","rarity":"Common","quests":[],"trophies":[],"records":{},"next_action":"Find a rival","next_action_route":"fight","daily_gift":"Opened","bonus_gift":"Not today"})
                      else:route.continue_()
                  page.route("**/*",route_request)
                  def open_site():
                      page.goto(base,wait_until="domcontentloaded",timeout=45000)
                      expect(page.locator("#eventConnectionText")).to_contain_text("Connected",timeout=30000)
                  def nav(dest):
                      selector=".play-dock" if w<=780 else ".topnav"
                      page.locator(selector+' [data-nav="'+dest+'"]').click()
                      expect(page.locator("#page-"+dest)).to_have_class("panel active")
                  open_site()
                  page.locator("#loginCTA").click()
                  expect(page.locator("#authDialog")).to_be_visible()
                  expect(page.locator("#demoCode")).to_be_hidden()
                  expect(page.locator("#qaLoginTools")).not_to_have_attribute("open","")
                  page.keyboard.press("Escape")
                  expect(page.locator("#authDialog")).to_be_hidden()
                  state["account"]="discord";open_site()
                  expect(page.locator("#underworldRequired")).to_be_visible()
                  expect(page.locator("#registration")).to_be_hidden()
                  state["account"]="linked";open_site()
                  expect(page.locator("#playStatus")).to_be_visible()
                  expect(page.locator("#playAmmo")).to_have_text("10")
                  expect(page.locator("#playPrimary")).to_have_text("Fight rivals")
                  expect(page.locator("#accountTools")).not_to_have_attribute("open","")
                  assert page.locator("#playPrimary").bounding_box()["y"]<page.locator("#hqCollector").bounding_box()["y"]
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  page.screenshot(path=f"qa-screenshots/{label}-quick-hq.png",full_page=True)
                  page.locator("#playPrimary").click()
                  expect(page.locator("#page-combat")).to_have_class("panel active")
                  expect(page.locator("#targetSelect")).to_have_value(rival["player_id"])
                  expect(page.locator("#targetDetail")).to_contain_text("2 scoring hits left")
                  expect(page.locator("#throwStyleHint")).to_contain_text("60%")
                  assert state["keys"]==[],"navigation must not submit an attack"
                  page.locator("#throwButton").click()
                  expect(page.locator("#throwButton")).to_have_text("Retry previous throw",timeout=30000)
                  expect(page.locator("#playFeedbackText")).to_contain_text("may have succeeded")
                  page.locator("#playRefresh").click()
                  expect(page.locator("#playAmmo")).to_have_text("9",timeout=30000)
                  expect(page.locator("#throwButton")).to_be_enabled()
                  expect(page.locator("#targetSelect")).to_have_value(rival["player_id"])
                  page.locator("#throwButton").click()
                  expect(page.locator("#combatOutcomeTitle")).to_have_text("Previously recorded throw",timeout=30000)
                  expect(page.locator("#playPoints")).to_have_text("54")
                  expect(page.locator("#throwButton")).to_be_disabled()
                  assert len(state["keys"])==2 and state["keys"][0]==state["keys"][1],state["keys"]
                  expect(page.locator("#noRivals")).to_be_visible()
                  page.screenshot(path=f"qa-screenshots/{label}-combat.png",full_page=True)
                  nav("boss")
                  expect(page.locator("#raidPlayStatus")).to_contain_text("cooldown")
                  expect(page.locator("#bossButton")).to_be_disabled()
                  nav("shop")
                  expect(page.locator("#fitPortrait")).to_be_visible()
                  page.locator('[data-jump="marketCatalogue"]').click()
                  expect(page.locator("#marketCatalogue")).to_be_visible()
                  nav("cities");expect(page.locator("#citySelectors button")).to_have_count(6)
                  nav("wire");expect(page.locator("#wirePaper")).to_be_visible()
                  page.go_back()
                  expect(page.locator("#page-cities")).to_have_class("panel active")
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  assert not errors,errors
                  print(label,"PASS guest login, single-character guard, quick-play, exact retry, nav and history; no real writes")
                  page.close()
              browser.close()
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowfall-v296h-usability-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
