name: Python tests
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src bot.py
      - name: Unit tests
        run: python -m pytest -q
