name: Snowball bot tests
on:
  push:
  pull_request:
concurrency:
  group: snowfall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Compile
        run: python -m compileall -q src bot.py
      - name: Check browser JavaScript syntax
        run: node --check src/snowfall/platform/static/app.js
      - name: Browser replay and reconnect tests
        run: node --test tests/test_v295_browser.mjs tests/test_v296_browser.mjs tests/test_v296a_wardrobe.mjs tests/test_v296c_browser.mjs tests/test_v296d_browser.mjs tests/test_v296e_browser.mjs tests/test_v296f_browser.mjs tests/test_v296g_browser.mjs tests/test_v296h_browser.mjs tests/test_v296i_browser.mjs tests/test_v297_browser.mjs tests/test_v298g_navigation.mjs tests/test_v298h_avatars.mjs tests/test_v298i_nameplates.mjs tests/test_v298j_banner_scarf.mjs tests/test_v298k_scarf_split.mjs tests/test_v298l_resources.mjs
      - name: Lint (fatal errors)
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snowfall
          POSTGRES_PASSWORD: snowfall-test-only
          POSTGRES_DB: snowfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowfall -d snowfall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SNOWFALL_PG_TEST_DSN: postgresql://snowfall:snowfall-test-only@localhost:5432/snowfall_test
      SNOWFALL_PG_TEST_CONFIRM: EMPTY_TEST_DATABASE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,postgres,web]"
      - name: Build real deployable wheel (detect missing static package-data)
        run: python -m pip wheel --no-deps . -w output/wheels
      - name: Assert 21 artwork files actually ship in the wheel
        run: python tests/check_v298l_wheel_assets.py output/wheels
      - name: Check migrations and compatibility
        run: python -m pytest -q tests/test_v292_postgres.py tests/test_v293_postgres.py tests/test_v293a_postgres.py tests/test_v294a_postgres.py tests/test_v294b_postgres.py tests/test_v294c_relink.py tests/test_v294d_discard.py tests/test_v294e_postgres.py tests/test_v294e1_cutover.py tests/test_v295_launch_audit_postgres.py tests/test_v295_postgres.py
