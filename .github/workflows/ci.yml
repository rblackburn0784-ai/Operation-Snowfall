name: Snowball bot tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Compile
        run: python -m compileall -q src bot.py
      - name: Lint (fatal errors)
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snowfall
          POSTGRES_PASSWORD: snowfall-test-only
          POSTGRES_DB: snowfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowfall -d snowfall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SNOWFALL_PG_TEST_DSN: postgresql://snowfall:snowfall-test-only@localhost:5432/snowfall_test
      SNOWFALL_PG_TEST_CONFIRM: EMPTY_TEST_DATABASE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,postgres,web]"
      - name: Check migrations and compatibility
        run: python -m pytest -q tests/test_v292_postgres.py tests/test_v293_postgres.py
