                      expect(dock).to_be_visible()
                  expect(page.locator("#streetsChatEnable")).to_be_enabled()
                  page.route("https://e.widgetbot.io/**",lambda route:route.fulfill(status=200,content_type="text/html",body="<p>Widget test frame</p>"))
                  page.locator("#streetsChatEnable").click()
                  expect(frame).to_have_attribute("src","https://e.widgetbot.io/channels/123456789012345678/987654321012345678")
                  expect(page.locator("#streetsChatEmbed")).to_be_visible()
