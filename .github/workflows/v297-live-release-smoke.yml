                      expect(dock).to_be_visible()
                      page.locator("#streetsChatClose").click()
                      expect(dock).to_be_hidden()
                  page.locator("#communityRefresh").click()
                  expect(page.locator("#communityRefresh")).to_be_enabled(timeout=30000)
                  page.locator("#page-community").screenshot(path=f"qa-screenshots/{label}-community.png")
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  nav("combat");expect(page.locator("#noRivals")).to_be_visible()
                  nav("wire");expect(page.locator("#wirePaper")).to_be_visible()
                  expect(page.locator("#wirePaper")).to_have_class("wire-paper has-wire-template")
                  expect(page.locator("#wireEdition")).to_contain_text("DAY 2 / 7")
                  expect(page.locator("#wireHeadlines .wire-story")).to_have_count(4)
                  assert page.locator("#wireHeadlines .wire-story .wire-byline").all_text_contents()==["Combat","Boss","Cities","Community"]
                  page.locator("#wireDay").select_option("1")
                  expect(page.locator("#wireEdition")).to_contain_text("DAY 1 / 7")
                  expect(page.locator("#wireEdition")).to_contain_text("ARCHIVE")
                  page.locator("#refreshWire").click()
                  expect(page.locator("#wireDay")).to_be_enabled()
                  expect(page.locator("#wireLead")).to_contain_text("QA Winter Player")
                  page.locator("#wireDay").select_option("current")
                  expect(page.locator("#wireEdition")).to_contain_text("DAY 2 / 7")
                  # A child can be internally well aligned yet clipped by its parent.
                  width=page.locator(".wire-frontpage").evaluate("""n=>{
                      const p=n.parentElement.getBoundingClientRect(),r=n.getBoundingClientRect();
                      return {left:r.left-p.left,right:r.right-p.right,width:r.width,parent:p.width,scroll:n.scrollWidth-n.clientWidth};
                  }""")
                  assert abs(width["left"])<=2 and abs(width["right"])<=2 and abs(width["width"]-width["parent"])<=2 and width["scroll"]<=2,width
                  geometry=page.locator(".wire-frontpage").evaluate("""n=>{
                      const box=n.getBoundingClientRect();
                      return [...n.querySelectorAll('.wire-edition-line,.wire-lead-block,.wire-story')].map(e=>{
                          const r=e.getBoundingClientRect();return {x:(r.x-box.x)/box.width,y:(r.y-box.y)/box.height,w:r.width/box.width,h:r.height/box.height,overflow:e.scrollHeight-e.clientHeight};
                      });
                  }""")
                  assert len(geometry)==6,geometry
                  for b in geometry:
                      assert b["x"]>=0 and b["y"]>=0 and b["x"]+b["w"]<=1.001 and b["y"]+b["h"]<=1.001,b
                      assert b["overflow"]<=3,b
                  assert .12<geometry[0]["y"]<.16 and .25<geometry[1]["y"]<.31,geometry
                  assert geometry[2]["x"]<geometry[3]["x"] and geometry[2]["y"]<geometry[4]["y"],geometry
                  page.locator("#wirePaper").screenshot(path=f"qa-screenshots/{label}-newspaper.png",style=".play-status,.play-feedback,.play-dock,.toast{visibility:hidden!important}")
                  expect(page.locator("#siteBanner")).to_be_visible()
                  assert page.locator("#siteBanner").evaluate("n=>n.complete&&n.naturalWidth>0")
                  assert page.locator(".topbar").evaluate("n=>getComputedStyle(n).backgroundImage.includes('snowfall-header-city.webp')")
                  if w<=780:
                      page.locator("#menuToggle").click()
                      expect(page.locator("#menuToggle")).to_have_attribute("aria-expanded","true")
                      page.locator("#primaryNav [data-nav='wire']").click()
                      expect(page.locator("#menuToggle")).to_have_attribute("aria-expanded","false")
                  nav("cities");expect(page.locator("#citySiege")).to_be_visible()
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  assert not errors,errors
                  print(label,"PASS siege, historical isolation, artwork geometry and fictional single attack")
                  page.close()
              browser.close()
          # Collect actual browser-rendered portrait crops for visual review.
          sheet=Image.new("RGB",(8*170,2*194),"#112735")
          draw=ImageDraw.Draw(sheet)
          for i,key in enumerate(keys):
              for j,gear in enumerate(("goggles","scarf")):
                  im=Image.open(f"qa-screenshots/{key}-{gear}.png").convert("RGB")
                  im.thumbnail((162,162))
                  sheet.paste(im,(i*170+4,j*194+4));draw.text((i*170+4,j*194+168),key+" "+gear,fill="#f3dba7")
          sheet.save("qa-screenshots/cosmetic-contact-sheet.jpg",quality=90)
          print("PASS all writes intercepted; live game unchanged")
