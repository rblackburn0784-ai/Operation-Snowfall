                  expect(page.locator("#authDialog")).to_be_hidden()
                  page.evaluate("(id)=>{S.session={player_id:id,csrf:'fixture-csrf',links:[{provider:'underworld'}]};updateStreetsChat()}",fake)
                  if w<=980:
