                  if w<=980:
                      page.locator("#streetsChatClose").click()
                      expect(dock).to_be_hidden()
                  nav("combat")
                  expect(page.locator("#page-combat")).to_be_visible()
                  assert page.evaluate("window.__originalChatFrame===document.getElementById('streetsChatFrame')")
                  expect(frame).to_have_attribute("src","https://e.widgetbot.io/channels/123456789012345678/987654321012345678")
                  nav("home")
                  page.locator("#page-home [data-nav='community']").click()
                  expect(page.locator("#page-community")).to_be_visible()
                  if w<=980:
                      page.locator("#streetsChatLauncher").click()
                      expect(dock).to_be_visible()
                      expect(frame).to_have_attribute("src","https://e.widgetbot.io/channels/123456789012345678/987654321012345678")
                  # Changing player identities disconnects only this chat session.
                  page.evaluate("S.session=null;updateStreetsChat()")
                  assert frame.get_attribute("src") is None
                  expect(page.locator("#streetsChatEnable")).to_have_text("Sign in to enter chat")
                  page.locator("#streetsChatEnable").click()
                  expect(page.locator("#authDialog")).to_be_visible()
