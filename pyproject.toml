[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-snowfall"
version = "2.9.5b0"
description = "Operation Snowfall event with in-app test days, launch controls and prizes"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.6,<3", "Pillow>=11,<13", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "setuptools>=68"]
postgres = ["psycopg[binary]>=3.2,<4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
snowfall = "snowfall.app:main"

[tool.setuptools.package-data]
"snowfall.platform" = ["static/*.html", "static/*.css", "static/*.js"]
"snowfall.graphics" = [
    "art/boss/*.png",
    "art/cities/*.webp",
    "art/items/*.png",
    "art/v290/_manifest.json",
    "art/v290/arcade/*.webp",
    "art/v290/boss/*.webp",
    "art/v290/cities/banners/*.png",
    "art/v290/cities/crests/*.png",
    "art/v290/cities/map/*.png",
    "art/v290/cities/outcomes/*.png",
    "art/v290/combat/*.png",
    "art/v290/cosmetics/backgrounds/*.webp",
    "art/v290/cosmetics/banners/*.png",
    "art/v290/cosmetics/frames/*.png",
    "art/v290/cosmetics/gear/*.png",
    "art/v290/cosmetics/trails/*.png",
    "art/v290/items/*.png",
    "art/v290/mysteries/*.webp",
    "art/v290/portraits/*.webp",
    "art/v290/trophies/awards/*.png",
    "art/v290/trophies/backgrounds/*.png",
    "art/v290/trophies/effects/*.png",
    "art/v290/trophies/medals/*.png",
    "art/v290/wire/backgrounds/*.png",
    "art/v290/wire/banners/*.png",
    "art/v290/wire/overlays/*.png",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
