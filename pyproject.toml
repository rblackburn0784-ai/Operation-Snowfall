[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-snowfall"
version = "0.1.6c"
description = "Operation Snowfall event with in-app test days, launch controls and prizes"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.6,<3", "Pillow>=11,<13", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "setuptools>=68"]

[project.scripts]
snowfall = "snowfall.app:main"

[tool.setuptools.package-data]
"snowfall.graphics" = ["art/cities/*.webp", "art/items/*.png", "art/boss/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
